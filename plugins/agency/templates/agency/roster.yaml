# Instance state. Belongs to this machine, not to the agency repo.
agency:
  name: {{AGENCY_NAME_YAML}}
  emoji: {{EMOJI_YAML}}
  root: {{AGENCY_ROOT_YAML}}
  opened: {{DATE}}

agents:
  - name: {{AGENT_NAME_YAML}}
    title: {{TITLE_YAML}}
    folder: {{AGENT_FOLDER_YAML}}
    session_id: {{SESSION_ID_YAML}}
    status: active
